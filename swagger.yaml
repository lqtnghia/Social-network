openapi: 3.0.0
info:
  title: Authentication API
  description: API đơn giản cho xác thực người dùng
  version: 1.0.0
servers:
  - url: http://localhost:4010
    description: Máy chủ mock
paths:
  /api/signup:
    post:
      summary: Đăng ký người dùng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: 'Lê Quang Trọng Nghĩa'
                email:
                  type: string
                  example: 'lqtnghia2602@gmail.com'
                password:
                  type: string
                  example: '123456'
              required:
                - fullName
                - email
                - password
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng ký thành công'
                  userId:
                    type: string
                    example: '12345'
        '401':
          description: Đăng ký thất bại do dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Email đã tồn tại hoặc dữ liệu không hợp lệ'
  /api/login:
    post:
      summary: Đăng nhập người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'lqtnghia2602@gmail.com'
                password:
                  type: string
                  example: '123456'
              required:
                - email
                - password
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng nhập thành công'
                  accessToken:
                    type: string
                    example: 'mock-token-123'
        '401':
          description: Đăng nhập thất bại do thông tin không đúng
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Email hoặc mật khẩu không đúng'
  /api/verify-otp:
    post:
      summary: Xác minh OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'lqtnghia2602@gmail.com'
                otp:
                  type: string
                  example: '123456'
              required:
                - email
                - otp
      responses:
        '200':
          description: Xác minh OTP thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Xác minh OTP thành công'
                  accessToken:
                    type: string
                    example: 'mock-token-123'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '12345'
                      fullName:
                        type: string
                        example: 'Lê Quang Trọng Nghĩa'
                      email:
                        type: string
                        example: 'lqtnghia2602@gmail.com'
        '401':
          description: Xác minh OTP thất bại do mã OTP không đúng
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Mã OTP không đúng hoặc đã hết hạn'
  /api/auth-user:
    get:
      summary: Lấy thông tin người dùng đã xác thực
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: '12345'
                  fullName:
                    type: string
                    example: 'Lê Quang Trọng Nghĩa'
                  email:
                    type: string
                    example: 'lqtnghia2602@gmail.com'
        '401':
          description: Không được phép truy cập do token không hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Token không hợp lệ hoặc đã hết hạn'
/api/posts:
  post:
  summary: Tạo bài viết mới
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            content:
              type: string
              example: 'Đây là nội dung bài viết của tôi'
            image:
              type: string
              example: 'https://example.com/image.jpg'
          required:
            - content
  responses:
    '201':
      description: Tạo bài viết thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Tạo bài viết thành công'
              post:
                type: object
                properties:
                  id:
                    type: string
                    example: '67890'
                  content:
                    type: string
                    example: 'Đây là nội dung bài viết của tôi'
                  image:
                    type: string
                    example: 'https://example.com/image.jpg'
                  userId:
                    type: string
                    example: '12345'
                  createdAt:
                    type: string
                    format: date-time
                    example: '2025-03-16T12:00:00Z'
    '400':
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Nội dung bài viết không được để trống'
    '401':
      description: Không được phép truy cập do token không hợp lệ
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 'Token không hợp lệ hoặc đã hết hạn'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

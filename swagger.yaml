openapi: 3.0.0
info:
  title: Authentication API
  description: API đơn giản cho xác thực người dùng
  version: 1.0.0
servers:
  - url: http://localhost:4010
    description: Máy chủ mock
paths:
  /api/signup:
    post:
      summary: Đăng ký người dùng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: 'Lê Quang Trọng Nghĩa'
                email:
                  type: string
                  example: 'lqtnghia2602@gmail.com'
                password:
                  type: string
                  example: '123456'
              required:
                - fullName
                - email
                - password
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng ký thành công'
                  userId:
                    type: string
                    example: '12345'
  /api/login:
    post:
      summary: Đăng nhập người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'lqtnghia2602@gmail.com'
                password:
                  type: string
                  example: '123456'
              required:
                - email
                - password
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Đăng nhập thành công'
                  accessToken:
                    type: string
                    example: 'mock-token-123'
  /api/verify-otp:
    post:
      summary: Xác minh OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'lqtnghia2602@gmail.com'
                otp:
                  type: string
                  example: '123456'
              required:
                - email
                - otp
      responses:
        '200':
          description: Xác minh OTP thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Xác minh OTP thành công'
                  accessToken:
                    type: string
                    example: 'mock-token-123'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '12345'
                      fullName:
                        type: string
                        example: 'Lê Quang Trọng Nghĩa'
                      email:
                        type: string
                        example: 'lqtnghia2602@gmail.com'
    summary: Xác minh OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                example: 'lqtnghia2602@gmail.com'
              otp:
                type: string
                example: '123456'
            required:
              - email
              - otp
    responses:
      '200':
        description: Xác minh OTP thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Xác minh OTP thành công'
                accessToken:
                  type: string
                  example: 'mock-token-123'
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      example: '12345'
                    fullName:
                      type: string
                      example: 'Lê Quang Trọng Nghĩa'
                    email:
                      type: string
                      example: 'lqtnghia2602@gmail.com'
  /api/auth-user:
    get:
      summary: Lấy thông tin người dùng đã xác thực
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: '12345'
                  fullName:
                    type: string
                    example: 'Lê Quang Trọng Nghĩa'
                  email:
                    type: string
                    example: 'lqtnghia2602@gmail.com'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
